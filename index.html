function buildSprite(rows) {
 if (rows.length !== CAR_SPRITE.height || rows.some(row => row.length !== CAR_SPRITE.width)) {
  throw new Error('Car sprite must contain exactly 36 rows of 144 characters.');
 }
 const c = makeCanvas(CAR_SPRITE.width, CAR_SPRITE.height);
 const g = c.getContext('2d');
 g.imageSmoothingEnabled = false;
 rows.forEach((row, y) => {
  for (let x = 0; x < row.length; x++) {
   const ch = row[x];
   if (ch === '.') continue;
   if (!Object.hasOwn(PALETTE, ch)) throw new Error('Unknown car sprite character: ' + ch);
   g.fillStyle = PALETTE[ch];
   g.fillRect(x, y, 1, 1);
  }
 });
 return c;
}

   const sx = Math.floor((x + 0.5) * CAR_RENDER.divisor);

    const rx = R(wheel.x + dx * cosine + dy * sine);

   for (let channel = 0; channel < 4; channel++) pixels.data[target + channel] = sourcePixels[sample + channel];

// Keep the original horizontal bitmap intact and rest it on the higher wheel contact.
function carRampSurface(x){return Math.min(rampSurface(x+CAR_RENDER.rearWheelX-CAR_RENDER.anchorX),rampSurface(x+CAR_RENDER.frontWheelX-CAR_RENDER.anchorX));}
function rampSlope(x){const t=clamp((x-TUNING.rampStart)/(TUNING.rampEnd-TUNING.rampStart),0,1);return TUNING.rampHeight*6*t*(1-t)/(TUNING.rampEnd-TUNING.rampStart);}
function drawBridge(){
 rect(ctx,0,roadY+9,W,H-roadY,P.deep);
 const under=layers[3].under,offset=R(mod(camera*0.45,BW));for(let x=-offset;x<W;x+=BW)ctx.drawImage(under,x,roadY+9);
 rect(ctx,0,roadY-8,W,1,P.mid);rect(ctx,0,roadY-4,W,1,P.dark);for(let x=R(-mod(camera,13));x<W;x+=13)rect(ctx,x,roadY-8,1,8,P.dark);
 for(let x=R(-mod(camera,96));x<W;x+=96)ctx.drawImage(bridgeTile,x,roadY);
 if(camera<TUNING.rampEnd+30){
  const end=Math.min(W,R(TUNING.rampEnd-camera));
  for(let sx=0;sx<end;sx++){const wx=sx+camera,y=R(rampSurface(wx));rect(ctx,sx,y,1,5,P.dark);rect(ctx,sx,y,1,1,P.light);rect(ctx,sx,y+5,1,3,P.near);if(sx%2===0)rect(ctx,sx,y+3,1,1,P.mid);}
  for(let wx=18;wx<TUNING.rampEnd;wx+=42){const x=R(wx-camera),y=R(rampSurface(wx)+8);if(x>-7&&x<W){rect(ctx,x,y,5,roadY-y,P.near);rect(ctx,x,y,1,roadY-y,P.mid);}}
 }
}
// 08 · STEAM. Fixed particle pool; white-to-gray/dither fading, never alpha blending.
const steam=Array.from({length:TUNING.steamCapacity},()=>({life:0,maxLife:1,x:0,y:0,vx:0,vy:0,size:1}));
let steamCursor=0,steamBudget=0;
function emitSteam(x,y,vx,vy){const p=steam[steamCursor];steamCursor=(steamCursor+1)%steam.length;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=p.maxLife=rand(0.25,0.68);p.size=randint(1,2);}
function updateSteam(dt){
 for(const p of steam)if(p.life>0){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*0.7;p.vy*=1-dt*0.9;}
 if(phase==='running'&&held()){
  steamBudget+=dt*(150+Math.max(0,-player.vy)*1.2);
  while(steamBudget>=3){
   steamBudget-=3;
   emitSteam(player.x+CAR_RENDER.rearWheelX-CAR_RENDER.anchorX,player.y-1,rand(-13,9)-speed*0.12,rand(32,63));
   emitSteam(player.x+CAR_RENDER.frontWheelX-CAR_RENDER.anchorX,player.y-1,rand(-10,13)-speed*0.12,rand(32,63));
   emitSteam(player.x+CAR_RENDER.rearNozzleX-CAR_RENDER.anchorX,player.y+CAR_RENDER.rearNozzleY-CAR_RENDER.groundLine,rand(-58,-30),rand(-5,7));
  }
 }
}
function drawSteam(){for(const p of steam)if(p.life>0){const age=1-p.life/p.maxLife,s=Math.min(3,p.size+R(age*2)),x=R(p.x-camera),y=R(p.y);if(age<0.55)rect(ctx,x,y,s,s,age<0.25?P.white:P.light);else if(age<0.85)dither(ctx,x,y,s,s,P.light);else if((Math.floor(cityTime*30)+R(p.maxLife*100))%2===0)rect(ctx,x,y,1,1,P.light);}}
// 09 · TRAFFIC. Training car first; then signals immediately before varied jams.
// Slots are recycled. Traffic density and speed rise gradually; never >6 per jam.
const traffic=Array.from({length:TUNING.vehicleCapacity},()=>({active:false,x:0,sprite:vehicleSprites[2]}));
const signals=Array.from({length:TUNING.signalCapacity},()=>({active:false,x:0}));
let nextJam=0,vehicleCursor=0,signalCursor=0;
function addVehicle(x,type){const v=traffic[vehicleCursor];vehicleCursor=(vehicleCursor+1)%traffic.length;v.active=true;v.x=x;v.sprite=vehicleSprites[type];}
function addJam(){
 const difficulty=clamp(runTime/110,0,1),count=randint(2,Math.min(6,3+Math.floor(difficulty*3)));
 const signal=signals[signalCursor];signalCursor=(signalCursor+1)%signals.length;signal.active=true;signal.x=nextJam-24;
 let x=nextJam;for(let i=0;i<count;i++){const type=randint(0,5);addVehicle(x,type);x+=vehicleSprites[type].w+rand(6,17-difficulty*8);}
 nextJam=x+rand(185-difficulty*65,255-difficulty*100);
}
function updateTraffic(){for(const v of traffic)if(v.active&&v.x+v.sprite.w<camera-20)v.active=false;for(const s of signals)if(s.active&&s.x<camera-30)s.active=false;while(nextJam<camera+W+180)addJam();}
function drawSignals(){
 // Keep a single colored focal point: the nearest visible jam warning.
 let nearest=null;
 for(const s of signals)if(s.active&&s.x-camera>=-12&&s.x-camera<W+12&&(!nearest||s.x<nearest.x))nearest=s;
 if(nearest){const x=R(nearest.x-camera),y=roadY-42;
  rect(ctx,x+4,y+15,3,27,P.dark);rect(ctx,x+4,y+15,1,27,P.light);rect(ctx,x+2,roadY-2,8,2,P.near);rect(ctx,x,y,11,19,P.near);rect(ctx,x,y,10,1,P.mid);rect(ctx,x,y+1,1,17,P.dark);
  // Three dim red squares form a crisp glow. All non-signal artwork is grayscale.
  rect(ctx,x+2,y+2,7,7,P.redDim);rect(ctx,x-1,y+4,2,3,P.redDim);rect(ctx,x+10,y+4,2,3,P.redDim);rect(ctx,x+3,y+3,5,5,P.red);rect(ctx,x+4,y+2,3,1,P.red);
  rect(ctx,x+3,y+12,5,4,P.greenDim);rect(ctx,x+4,y+11,3,1,P.greenDim);rect(ctx,x+1,y+9,9,1,P.black);
 }
}
function drawTraffic(){for(const v of traffic)if(v.active){const x=R(v.x-camera);if(x>-v.sprite.w&&x<W){dither(ctx,x+2,roadY+1,v.sprite.w-2,2,P.black);ctx.drawImage(v.sprite.canvas,x,roadY-v.sprite.h);}}}
function collision(){
 // Coarse bounds first, then cached opaque pixels. The raised wing is cosmetic;
 // both spoiler states use the same body mask and can never land on a roof.
 const left=R(player.x-camera-CAR_RENDER.anchorX),top=R(player.y-CAR_RENDER.groundLine);
 for(const v of traffic)if(v.active){
  const vx=R(v.x-camera),vy=roadY-v.sprite.h;
  const x0=Math.max(left,vx),x1=Math.min(left+CAR_RENDER.width,vx+v.sprite.w);
  const y0=Math.max(top,vy),y1=Math.min(top+CAR_RENDER.height,roadY);
  if(x0>=x1||y0>=y1)continue;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
   if(carCollisionMask[(y-top)*CAR_RENDER.width+x-left]&&v.sprite.mask[(y-vy)*v.sprite.w+x-vx])return true;
  }
 }
 return false;
}
// 10 · PHYSICS, INPUT & PERSISTENCE. Fixed timestep with focus-safe hold controls.
let phase='ready',camera=0,speed=0,runTime=0,score=0,best=0,rampSpeed=18,deathTimer=0;
const player={x:CAR_SPRITE.startX,y:0,vy:0};let uiTime=0,bestAtStart=0,paused=false;
const keys=new Set(),pointers=new Set(),held=()=>keys.size>0||pointers.size>0;
try{best=Math.max(0,Math.floor(Number(localStorage.getItem('steamline-best'))||0));if(!Number.isFinite(best))best=0;}catch(_){}
function resize(){
 const oldRoad=roadY,vw=window.innerWidth,vh=window.innerHeight,portrait=vh>vw;
 // Keep a generous road view on phones; at most 3 cached city blocks show.
 scale=Math.max(1,Math.floor(Math.min(vw/(portrait?320:480),vh/(portrait?480:180))),Math.ceil(vw/1024));
 W=Math.floor(vw/scale);H=Math.floor(vh/scale);canvas.width=W;canvas.height=H;
 safeTop=Math.ceil((parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top'))||0)/scale);
 canvas.style.width=W*scale+'px';canvas.style.height=H*scale+'px';canvas.style.left=Math.floor((vw-W*scale)/2)+'px';canvas.style.top=Math.floor((vh-H*scale)/2)+'px';ctx.imageSmoothingEnabled=false;
 roadY=R(H*(portrait?0.77:0.78));anchor=R(clamp(W*0.23,CAR_SPRITE.startX,132));player.y+=roadY-oldRoad;
 for(const p of steam)if(p.life>0)p.y+=roadY-oldRoad;
 if(phase==='running'){camera=Math.max(0,player.x-anchor);player.y=clamp(player.y,CAR_RENDER.groundLine+Math.max(32,safeTop+24),roadY);}
 if(phase==='ready')player.y=carRampSurface(player.x);
}
function resetGame(){
 phase='ready';camera=0;speed=0;runTime=0;score=0;rampSpeed=18;deathTimer=0;steamBudget=0;uiTime=0;paused=false;
 player.x=CAR_SPRITE.startX;player.y=carRampSurface(player.x);player.vy=0;bestAtStart=best;keys.clear();pointers.clear();
 carSpriteController.reset();
 wheelController.reset();
 for(const v of traffic)v.active=false;for(const s of signals)s.active=false;for(const p of steam)p.life=0;vehicleCursor=0;signalCursor=0;
 const firstX=TUNING.rampEnd+Math.max(220,W*0.45);addVehicle(firstX,2);nextJam=firstX+255;
 for(let li=0;li<3;li++)layers[li].blocks.forEach((block,i)=>block.worldX=i*BW);
 monorail.reset();resetBirds();airplane.active=false;airplane.timer=rand(12,26);cityTime=0;restartButton.hidden=true;announce.textContent='Ready. Hold Space or touch the screen to launch.';
}
function startGame(){phase='launch';announce.textContent='Launching. Hold to rise. Release to glide.';}
function gameOver(){phase='over';deathTimer=0;keys.clear();pointers.clear();if(score>best){best=score;try{localStorage.setItem('steamline-best',String(best));}catch(_){}}restartButton.hidden=false;announce.textContent='Run ended. Score '+score+'. Best '+best+'. Play again.';}
function press(){if(paused)paused=false;if(phase==='over'){if(deathTimer>0.38)resetGame();return false;}if(phase==='ready')startGame();return true;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.focus({preventScroll:true});if(press()){pointers.add(e.pointerId);try{canvas.setPointerCapture(e.pointerId);}catch(_){}}});
const releasePointer=e=>pointers.delete(e.pointerId);
window.addEventListener('pointerup',releasePointer);window.addEventListener('pointercancel',releasePointer);canvas.addEventListener('lostpointercapture',releasePointer);
window.addEventListener('keydown',e=>{if(e.code!=='Space')return;e.preventDefault();if(e.repeat)return;if(press())keys.add(e.code);});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();keys.delete(e.code);}});
restartButton.addEventListener('click',()=>{resetGame();canvas.focus({preventScroll:true});});
function clearInput(){keys.clear();pointers.clear();}
window.addEventListener('blur',()=>{clearInput();if(phase==='running'||phase==='launch')paused=true;});
document.addEventListener('visibilitychange',()=>{clearInput();if(document.hidden&&(phase==='running'||phase==='launch'))paused=true;});
window.addEventListener('resize',resize);
function update(dt){
 uiTime+=dt;if(paused)return;updateCity(dt);
 if(phase==='over'){deathTimer+=dt;updateSteam(dt);return;}
 const previousX=player.x;
 if(phase==='launch'){
  carSpriteController.update(dt, false, false, true);
  const slope=rampSlope(player.x);rampSpeed=Math.min(96,rampSpeed+(14+slope*102)*dt);player.x+=rampSpeed*dt;player.y=carRampSurface(player.x);
  const target=Math.max(0,player.x-anchor);camera+=(target-camera)*(1-Math.exp(-6*dt));
  if(player.x>=RAMP_EXIT_X){phase='running';speed=TUNING.startSpeed;player.y=roadY;player.vy=0;}
 }else if(phase==='running'){
  runTime+=dt;speed=Math.min(TUNING.maxSpeed,TUNING.startSpeed+runTime*TUNING.speedGain);player.x+=speed*dt;camera+=(Math.max(0,player.x-anchor)-camera)*(1-Math.exp(-9*dt));
  const acceleration=TUNING.gravity-(held()?TUNING.lift:0)-player.vy*TUNING.airDrag;
  player.vy=clamp(player.vy+acceleration*dt,-TUNING.maxRise,TUNING.maxFall);player.y+=player.vy*dt;
  if(player.y>=roadY){player.y=roadY;player.vy=0;}
  const ceiling=CAR_RENDER.groundLine+Math.max(32,safeTop+24);
  if(player.y<ceiling){player.y=ceiling;player.vy=Math.max(0,player.vy);}
  carSpriteController.update(dt, player.y < roadY, held());
  score=Math.max(0,Math.floor((player.x-RAMP_EXIT_X)/6));updateTraffic();if(collision())gameOver();
 }
 if(phase==='launch'||phase==='running')wheelController.update(dt,player.x-previousX,phase==='launch'||player.y>=roadY);
 updateSteam(dt);
}
// 11 · COMPOSITION & PIXEL UI. Only the score remains during play.
function drawPlayer(){
 const x=R(player.x-camera-CAR_RENDER.anchorX),y=R(player.y-CAR_RENDER.groundLine);
 if(phase!=='ready'&&phase!=='launch'){
  const width=R(clamp(58-(roadY-player.y)*0.075,25,58));
  dither(ctx,x+CAR_RENDER.anchorX-R(width/2),roadY+1,width,2,P.black);
 }
 const sprite=CAR_FRAMES[carSpriteController.state][wheelController.frame];
 ctx.drawImage(sprite,x,y);
}
function button(t,x,y,w,h,size=1){rect(ctx,x+2,y+3,w,h,P.black);rect(ctx,x,y,w,h,P.light);rect(ctx,x,y,w-1,h-1,P.white);rect(ctx,x,y,w,1,P.white);rect(ctx,x+w-1,y,1,h,P.mid);rect(ctx,x,y+h-1,w,1,P.mid);text(ctx,t,x+R((w-textWidth(t,size))/2),y+R((h-7*size)/2),P.near,size);}
function drawUI(){
 // Text remains readable at 1x phone scale; cached car frames are 72x18.
 const uiSize=scale===1?2:1;
 if(phase==='ready'){
  const titleScale=uiSize===2?4:3,ty=R(Math.max(16,(roadY-135)*0.5+7));
  const subtitleY=ty+titleScale*7+9;
  const promptY=subtitleY+uiSize*7+12,releaseY=promptY+uiSize*7+5;
  const cardWidth=Math.max(textWidth('STEAMLINE',titleScale),textWidth('HOLD SPACE / TOUCH',uiSize))+22;
  const cardX=R((W-cardWidth)/2),cardHeight=releaseY+uiSize*7+8-(ty-10);
  dither(ctx,cardX+3,ty-7,cardWidth,cardHeight,P.dark);
  rect(ctx,cardX,ty-10,cardWidth,cardHeight,P.deep);
  rect(ctx,cardX,ty-10,cardWidth,1,P.mid);
  centerText('STEAMLINE',ty,P.white,titleScale);
  centerText('ABOVE THE RUSH',subtitleY,P.light,uiSize);
  if(Math.sin(uiTime*2)>-0.75)centerText('HOLD SPACE / TOUCH',promptY,P.white,uiSize);
  centerText('RELEASE TO GLIDE',releaseY,P.mid,uiSize);
  const ax=R(player.x-camera+CAR_RENDER.width-CAR_RENDER.anchorX+8),ay=R(player.y-8);line(ctx,ax,ay-3,ax+3,ay,P.mid);line(ctx,ax+3,ay,ax,ay+3,P.mid);
 }else if(phase==='over'){
  const large=uiSize===2,pw=Math.min(large?236:192,W-20),ph=large?151:109,x=R((W-pw)/2),y=R(Math.max(20,(H-ph)/2-8));
  dither(ctx,x+4,y+5,pw,ph,P.black);rect(ctx,x,y,pw,ph,P.deep);rect(ctx,x,y,pw,1,P.mid);rect(ctx,x,y,1,ph,P.dark);
  centerText('RUN ENDED',y+12,P.white,large?3:2);
  centerText(String(score).padStart(5,'0'),y+(large?43:35),P.white,large?3:2);
  centerText((score>bestAtStart?'NEW BEST ':'BEST ')+String(best).padStart(5,'0'),y+(large?77:57),P.light,uiSize);
  const bw=large?160:112;button('PLAY AGAIN',R((W-bw)/2),y+(large?103:76),bw,large?34:23,uiSize);
 }else{
  const label=String(score).padStart(5,'0'),width=textWidth(label,uiSize),scoreY=Math.max(12,safeTop+4);
  rect(ctx,R((W-width)/2)-5,scoreY-3,width+10,uiSize*7+6,P.white);centerText(label,scoreY,P.near,uiSize);
 }
 if(paused){const w=textWidth('HOLD TO RESUME',uiSize)+28,x=R((W-w)/2),y=R(H/2-15);rect(ctx,x,y,w,uiSize*7+22,P.deep);centerText('HOLD TO RESUME',y+11,P.white,uiSize);}
}
function render(){drawCity();drawBridge();drawSignals();drawTraffic();drawSteam();drawPlayer();drawUI();}
let last=0,accumulator=0;
function frame(now){if(!last)last=now;accumulator+=Math.min((now-last)/1000,0.06);last=now;while(accumulator>=TUNING.step){update(TUNING.step);accumulator-=TUNING.step;}render();requestAnimationFrame(frame);}
resize();resetGame();requestAnimationFrame(frame);
})();
</script>
</body>
